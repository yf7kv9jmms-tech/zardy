<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>FNF: Zardy Foolhardy Mod Pack</title>
	<meta name="description" content="Standalone web build of FNF: Zardy Foolhardy Mod Pack.">
	<meta name="theme-color" content="#050505">
	<link rel="icon" type="image/png" href="./assets/images/logo.png">
	<script>
		window.addEventListener("load", function () {
			window.focus();
			document.body.addEventListener("click", function () {
				window.focus();
			}, false);
		});
		window.addEventListener("keydown", function (event) {
			if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
				event.preventDefault();
			}
		}, false);
	</script>
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<script type="text/javascript" src="./Funkin.js?233s"></script>
	<script>
		window.addEventListener("touchmove", function (event) {
			event.preventDefault();
		}, { capture: false, passive: false });
		if (typeof window.devicePixelRatio !== "undefined" && window.devicePixelRatio > 2) {
			var meta = document.getElementById("viewport");
			meta.setAttribute("content", "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", user-scalable=no");
		}
	</script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
		}
		#openfl-content {
			background: #000000;
			width: 100%;
			height: 100%;
		}
		@font-face {
			font-family: 'Pixel Arial 11 Bold';
			src: url('assets/fonts/pixel.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'VCR OSD Mono';
			src: url('assets/fonts/vcr.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Nokia Cellphone FC Small';
			src: url('flixel/fonts/nokiafc22.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Monsterrat';
			src: url('flixel/fonts/monsterrat.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
	</style>
</head>
<body>
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	<div id="openfl-content"></div>
	<script type="text/javascript">
		lime.embed("Funkin", "openfl-content", 1280, 720, { parameters: {} });

		(function () {
			var root = document.getElementById("openfl-content");
			if (root) {
				root.setAttribute("tabindex", "0");
			}

			function focusGame() {
				try {
					window.focus();
				} catch (error) {}
				try {
					document.body.focus();
				} catch (error) {}
				try {
					if (root) {
						root.focus();
					}
				} catch (error) {}
			}

			function fireEnter(target) {
				if (!target || typeof target.dispatchEvent !== "function") {
					return;
				}
				var down = new KeyboardEvent("keydown", {
					key: "Enter",
					code: "Enter",
					keyCode: 13,
					which: 13,
					bubbles: true
				});
				var up = new KeyboardEvent("keyup", {
					key: "Enter",
					code: "Enter",
					keyCode: 13,
					which: 13,
					bubbles: true
				});
				try {
					Object.defineProperty(down, "keyCode", { get: function () { return 13; } });
					Object.defineProperty(down, "which", { get: function () { return 13; } });
					Object.defineProperty(up, "keyCode", { get: function () { return 13; } });
					Object.defineProperty(up, "which", { get: function () { return 13; } });
				} catch (error) {}
				target.dispatchEvent(down);
				target.dispatchEvent(up);
			}

			function nudgeTitleScreen() {
				focusGame();
				fireEnter(window);
				fireEnter(document);
				fireEnter(document.body);
				if (root) {
					fireEnter(root);
				}
			}

			window.addEventListener("pointerdown", focusGame, { passive: true });
			window.addEventListener("mousedown", focusGame, { passive: true });
			window.addEventListener("touchstart", focusGame, { passive: true });

			setTimeout(nudgeTitleScreen, 3500);
			setTimeout(nudgeTitleScreen, 5500);
		})();
	</script>
</body>
</html>
