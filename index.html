<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Friday Night Funkin' — Zardy (Kade Engine)</title>
	<meta name="description" content="HTML5 build of FNF Zardy mod (Kade Engine).">
	<meta name="theme-color" content="#000000">
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<link rel="icon" type="image/png" href="./assets/images/logo.png">
	<script type="text/javascript">
		// Block rogue navigations to about:blank that prevent the game from loading.
		if (window.navigation) {
			window.navigation.addEventListener("navigate", function (e) {
				if (e.destination && e.destination.url === "about:blank") e.preventDefault();
			});
		}
	</script>
	<script type="text/javascript" src="./Funkin.js"></script>
	<script>
		window.addEventListener("touchmove", function (event) { event.preventDefault(); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio !== "undefined" && window.devicePixelRatio > 2) {
			var meta = document.getElementById("viewport");
			meta.setAttribute("content", "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", user-scalable=no");
		}
		window.addEventListener("keydown", function (e) {
			if (["Tab", "Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
				e.preventDefault();
			}
		}, false);
	</script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
			background: #000000;
		}
		#openfl-content {
			background: #000000;
			width: 100%;
			height: 100%;
		}
		#launch-overlay {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: linear-gradient(180deg, rgba(20, 10, 10, 0.95), rgba(0, 0, 0, 0.98));
			color: #eee;
			font-family: system-ui, sans-serif;
			text-align: center;
			cursor: pointer;
		}
		#launch-overlay.is-hidden {
			display: none;
		}
		#launch-card {
			max-width: 480px;
			padding: 24px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 12px;
			background: rgba(20, 20, 20, 0.9);
		}
		@font-face {
			font-family: 'Pixel Arial 11 Bold';
			src: url('assets/fonts/pixel.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'VCR OSD Mono';
			src: url('assets/fonts/vcr.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Nokia Cellphone FC Small';
			src: url('flixel/fonts/nokiafc22.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Monsterrat';
			src: url('flixel/fonts/monsterrat.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
	</style>
</head>
<body>
	<noscript>This webpage requires JavaScript.</noscript>
	<div id="launch-overlay" role="button" tabindex="0" aria-label="Start game">
		<div id="launch-card">
			<p style="margin:0 0 12px;font-size:1.1rem;">Click or tap to start (needed for audio in most browsers).</p>
			<p style="margin:0;font-size:0.85rem;opacity:0.75;">Friday Night Funkin' — Zardy · Kade Engine web build</p>
		</div>
	</div>
	<div id="openfl-content"></div>
	<script type="text/javascript">
		(function () {
			var overlay = document.getElementById("launch-overlay");
			var started = false;
			function startGame() {
				if (started) return;
				started = true;
				overlay.classList.add("is-hidden");
				lime.embed("Funkin", "openfl-content", 1280, 720, { parameters: {} });
			}
			overlay.addEventListener("click", startGame);
			overlay.addEventListener("keydown", function (e) {
				if (e.key === "Enter" || e.key === " ") {
					e.preventDefault();
					startGame();
				}
			});
		})();
	</script>
</body>
</html>
