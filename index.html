<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>FNF: Zardy Foolhardy Mod Pack</title>
	<meta name="description" content="Standalone web build of FNF: Zardy Foolhardy Mod Pack.">
	<meta name="theme-color" content="#050505">
	<link rel="icon" type="image/png" href="./assets/images/logo.png">
	<script>
		window.addEventListener("load", function () {
			window.focus();
			document.body.addEventListener("click", function () {
				window.focus();
			}, false);
		});
		window.addEventListener("keydown", function (event) {
			if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
				event.preventDefault();
			}
		}, false);
	</script>
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<script>
		window.addEventListener("touchmove", function (event) {
			event.preventDefault();
		}, { capture: false, passive: false });
		if (typeof window.devicePixelRatio !== "undefined" && window.devicePixelRatio > 2) {
			var meta = document.getElementById("viewport");
			meta.setAttribute("content", "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", user-scalable=no");
		}
	</script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
			background: #050505;
		}
		#openfl-content {
			background: #000000;
			width: 100%;
			height: 100%;
		}
		#launch-overlay {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background:
				radial-gradient(circle at top, rgba(143, 255, 111, 0.16), transparent 42%),
				linear-gradient(180deg, rgba(11, 20, 8, 0.98), rgba(2, 5, 2, 0.98));
			color: #f4ffe8;
			font-family: 'VCR OSD Mono', monospace;
			text-align: center;
			cursor: pointer;
		}
		#launch-overlay.is-hidden {
			display: none;
		}
		#launch-card {
			max-width: 520px;
			padding: 32px 28px;
			border: 1px solid rgba(181, 255, 153, 0.28);
			border-radius: 20px;
			background: rgba(9, 18, 8, 0.86);
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
		}
		#launch-card h1 {
			margin: 0 0 12px;
			font-size: clamp(1.8rem, 4vw, 3rem);
			letter-spacing: 0.06em;
			text-transform: uppercase;
		}
		#launch-card p {
			margin: 0;
			font-size: 0.98rem;
			line-height: 1.7;
			color: rgba(244, 255, 232, 0.82);
		}
		#launch-card strong {
			display: inline-block;
			margin-top: 18px;
			padding: 10px 16px;
			border-radius: 999px;
			background: rgba(154, 255, 120, 0.12);
			color: #cfffbd;
			font-size: 0.86rem;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}
		@font-face {
			font-family: 'Pixel Arial 11 Bold';
			src: url('assets/fonts/pixel.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'VCR OSD Mono';
			src: url('assets/fonts/vcr.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Nokia Cellphone FC Small';
			src: url('flixel/fonts/nokiafc22.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Monsterrat';
			src: url('flixel/fonts/monsterrat.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
	</style>
</head>
<body>
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	<div id="launch-overlay" role="button" tabindex="0" aria-label="Start Zardy Foolhardy Mod Pack">
		<div id="launch-card">
			<h1>Zardy Foolhardy</h1>
			<p>Click once to start the web build. This gives the game a real user interaction before it initializes audio.</p>
			<strong>Click Anywhere To Start</strong>
		</div>
	</div>
	<div id="openfl-content"></div>
	<script type="text/javascript">
		(function () {
			var overlay = document.getElementById("launch-overlay");
			var started = false;

			function startGame() {
				if (started) {
					return;
				}
				started = true;
				overlay.classList.add("is-hidden");

				var script = document.createElement("script");
				script.src = "./Funkin.js?233s";
				script.onload = function () {
					lime.embed("Funkin", "openfl-content", 1280, 720, { parameters: {} });
					try {
						window.focus();
					} catch (error) {}
				};
				document.head.appendChild(script);
			}

			overlay.addEventListener("click", startGame);
			overlay.addEventListener("keydown", function (event) {
				if (event.key === "Enter" || event.key === " ") {
					event.preventDefault();
					startGame();
				}
			});
		})();
	</script>
</body>
</html>
